name: issue-ops-triage
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-ops-triage-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  triage:
    if: vars.IO_ENABLED == 'true'
    # Repointed to the PUBLIC mirror. This repo is PUBLIC and wave-foundation is PRIVATE; a
    # public repo cannot `uses:` a private reusable workflow, so this call has been dying at
    # STARTUP on every issue event — no jobs, no logs, no check. Measured: failure x5 here,
    # against a control (other workflows in this repo succeed). wave-foundation#1327.
    uses: wave-av/wave-foundation-public/.github/workflows/io-triage.yml@f63b91566ab311b09599db6195da8c353cab1f69
    permissions:
      contents: read
      issues: write
    with:
      # The scripts must come from the mirror too — this repo's GITHUB_TOKEN cannot read
      # private foundation, which is the same wall one level down.
      scripts_repo: wave-av/wave-foundation-public
      # THIRD pointer — missed in #95 and caught by the pilot. This was a private-foundation
      # SHA, which does not exist in the mirror at all (`git cat-file` on it there: "could not
      # get object info"), so the scripts checkout failed even though scripts_repo was correct.
      # Pinned to the SAME mirror commit as `uses:` above, so workflow and scripts are one
      # reviewed version — the pin-both discipline wave-sec-gate.yml documents.
      scripts_ref: "f63b91566ab311b09599db6195da8c353cab1f69"
      owner: ${{ vars.IO_OWNER }}
    secrets:
      gh_pat: ${{ secrets.ISSUE_OPS_PAT }}
      bot_app_id: ${{ secrets.BOT_ISSUE_OPS_APP_ID }}
      bot_private_key: ${{ secrets.BOT_ISSUE_OPS_PRIVATE_KEY }}
