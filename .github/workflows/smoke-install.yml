name: smoke-install

# Regression guard for the fresh-install path: pack the REAL tarball this repo builds, install
# it into a clean temp project (no symlinked node_modules, no local `src/` on the resolve path),
# import it, and run the README quickstart against the live gateway. Catches the class of bug
# where `npm run build` and the tests pass locally but a first-time `npm install` breaks (wrong
# `exports` map, a dependency that only resolves inside this workspace, a missing `dist/` file).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack the real tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n1)"
          echo "tarball=$PWD/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Fresh install into a clean temp project
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$TARBALL" --registry=https://registry.npmjs.org

      - name: ESM import check
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smoke"
          node -e "
            import('@wave-av/adk').then((m) => {
              const keys = Object.keys(m);
              if (!m || keys.length === 0) { console.error('ESM import empty'); process.exit(1); }
              console.log('ESM ok -', keys.length, 'exports:', keys.slice(0, 10).join(', '));
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Every exports subpath resolves (ESM + CJS) from the installed tarball
        run: |
          set -euo pipefail
          cp scripts/check-exports.mjs "$RUNNER_TEMP/smoke/check-exports.mjs"
          cd "$RUNNER_TEMP/smoke"
          node check-exports.mjs

      # Live steps use a CUSTOMER key (repo secret WAVE_AGENT_KEY), never an
      # internal gateway key. Both scripts send GET requests only.
      - name: Hello-world quickstart (live gateway, no mocks)
        env:
          WAVE_AGENT_KEY: ${{ secrets.WAVE_AGENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$WAVE_AGENT_KEY" ]; then
            # Forks never get the secret, so this cannot fail the job. Say so
            # in the run summary: a green check here proves nothing live.
            echo "::warning title=Live quickstart smoke skipped::WAVE_AGENT_KEY is not set for this run, so the README quickstart was NOT exercised against the live gateway."
            exit 0
          fi
          cp scripts/smoke-quickstart.mjs "$RUNNER_TEMP/smoke/smoke-quickstart.mjs"
          cd "$RUNNER_TEMP/smoke"
          node smoke-quickstart.mjs

      - name: Live contract report (read-only)
        env:
          WAVE_AGENT_KEY: ${{ secrets.WAVE_AGENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$WAVE_AGENT_KEY" ]; then
            echo "::warning title=Live contract report skipped::WAVE_AGENT_KEY is not set for this run, so no ADK route was checked against the live gateway."
            exit 0
          fi
          cp scripts/live-contract.mjs "$RUNNER_TEMP/smoke/live-contract.mjs"
          cd "$RUNNER_TEMP/smoke"
          node live-contract.mjs
