# ============================================================================
# Auto-approve caller — single-maintainer review circuit-breaker.
# Calls the org SSOT reusable workflow in wave-foundation. Dormant unless the
# repo/org variable AUTO_APPROVE_ENABLED == '1'.
#
# Installs the proven org-standard auto-approve ceremony so author-only PRs
# get a real approving review (from wave-av-reviewbot) after a Slack-notified
# kill-window — killing the self-approval deadlock on this enforce_admins repo
# without ever toggling the branch-protection control.
#
# This workflow does NOT merge. It only submits an APPROVE review + enables
# native auto-merge; branch protection enforces every required check server-side.
# SSOT + threat model: wave-foundation/governance/auto-approve/README.md
# ============================================================================

name: Auto-approve

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to evaluate'
        required: true
        type: number

# A called workflow cannot exceed the caller's token scope, so grant the union
# the reusable workflow needs (approve + enable native auto-merge).
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

# MUST match the reusable workflow's invariant, which says in as many words:
# "one evaluation per PR at a time; never cancel a running kill-window"
# (cancel-in-progress: false). A reusable workflow's jobs are jobs of the CALLER's
# run, so a caller-level `cancel-in-progress: true` cancels the called job and
# silently overrides that.
#
# What it costs is the audit trail, not safety. The ceremony emits a Slack audit
# line either way at the end of its run. With `true`:
#   1. PR labeled `auto-approve` -> Slack ping delivered, 60s kill window opens.
#   2. Operator adds `hold` to KILL it -> that is itself a `labeled` event.
#   3. This concurrency group cancels the in-flight run MID-WINDOW.
#   4. A fresh run starts, sees `hold`, skips.
# The outcome is safe (no approval), but the cancelled run never reaches its
# audit line, so THE KILL IS NEVER RECORDED and the operator's ping is orphaned.
# With `false` the run completes its window, re-checks at gate (8), sees `hold`,
# aborts, and logs it. A kill that leaves no trace is the one outcome a
# review-bypass mechanism cannot afford.
#
# Nothing is lost by not cancelling: gate (8) already re-checks head-moved and
# aborts on a push during the window.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Defense in depth: never even start for drafts or fork PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false)
    uses: wave-av/wave-foundation/.github/workflows/reusable-auto-approve.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      kill-window-seconds: 60
      author-allowlist: 'yakimoto'
      approve-label: 'auto-approve'
      hold-label: 'hold'
    secrets:
      BOT_REVIEW_APP_ID: ${{ secrets.BOT_REVIEW_APP_ID }}
      BOT_REVIEW_PRIVATE_KEY: ${{ secrets.BOT_REVIEW_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_REVIEWBOT_CHANNEL_ID: ${{ secrets.SLACK_REVIEWBOT_CHANNEL_ID }}
