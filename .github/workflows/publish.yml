name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No registry-url: setup-node's registry-url writes an .npmrc referencing
      # ${NODE_AUTH_TOKEN}, and npm aborts config loading when that variable is
      # undefined. Trusted publishing needs no token, so we rely on the default
      # registry instead.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x, so
      # without this upgrade the OIDC exchange is simply unavailable. Pinned
      # rather than @latest: this job holds id-token: write, so it should not
      # execute whatever npm publishes next.
      - run: npm install -g npm@11.5.1

      - run: npm ci

      - run: npm run build

      # No NODE_AUTH_TOKEN: trusted publishing mints a short-lived OIDC
      # credential for the publish. Every dependency of this package is public,
      # so the install step needs no registry auth either.
      - run: npm publish --access public --provenance
